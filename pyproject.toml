[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "trace-debugger"
version = "0.2.6"
description = "Agent 轨迹失败治理 — Format B 解析、启发式检测、JSONL 记录、聚合统计、StepWatcher"
readme = "README.md"
requires-python = ">=3.10"

[project.optional-dependencies]
test = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]
dev = [
    "mypy>=1.8",
    "pip-audit>=2.6",
]
schema = [
    "jsonschema>=4.0",
]

[project.scripts]
trace-debug = "trace_debugger.cli:main"
tdebug = "trace_debugger.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["trace_debugger*"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
check_untyped_defs = false
allow_untyped_defs = true
allow_incomplete_defs = true
disable_error_code = [
    "arg-type",
    "assignment",
    "var-annotated",
    "misc",
    "type-var",
    "operator",
    "return-value",
    "union-attr",
]
files = ["trace_debugger"]
